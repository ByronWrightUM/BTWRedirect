      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;

      p {

    <main>
      <h1>BTW Technology Solutions has Moved</h1>

    <script>
      window.setTimeout(() => {
        window.location.replace("https://www.byronwright.ca/consulting");
